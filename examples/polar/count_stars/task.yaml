runtime:
  backend: docker
  image: polar-localhost-count-stars:latest
  network: host
  prepare:
    - type: upload_file
      source: assets/polar_stars.png
      target: /polar/session/polar_stars.png

agent:
  harness: shell
  custom_shell:
    command: |
      python3 - <<'PY'
      import base64
      import json
      import os
      import urllib.request

      image = base64.b64encode(open("/polar/session/polar_stars.png", "rb").read()).decode()
      payload = json.dumps({
          "model": "policy",
          "messages": [{
              "role": "user",
              "content": [
                  {"type": "image_url", "image_url": {"url": "data:image/png;base64," + image}},
                  {"type": "text", "text": os.environ["POLAR_INSTRUCTION"]},
              ],
          }],
      }).encode()
      request = urllib.request.Request(
          os.environ["OPENAI_BASE_URL"] + "/chat/completions",
          data=payload,
          headers={
              "Authorization": "Bearer " + os.environ["OPENAI_API_KEY"],
              "Content-Type": "application/json",
          },
      )
      print(urllib.request.urlopen(request).read().decode())
      PY

builder:
  strategy: per_request

evaluator:
  strategy: session_completed

metadata:
  recipe: count_stars
